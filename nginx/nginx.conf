worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    # Resolver Docker DNS — permite re-resolver upstreams cuando se recrean containers
    resolver 127.0.0.11 valid=10s;

    # ─── Upstream: microservicios ────────────────────────────────────────────

    upstream ms_flights {
        server ms-flights:8001;
    }
    upstream ms_bookings {
        server ms-bookings:8002;
    }
    upstream ms_routes {
        server ms-routes:8003;
    }
    upstream ms_sync {
        server ms-sync:8004;
    }
    upstream ms_tickets {
        server ms-tickets:8005;
    }
    upstream ms_dashboard {
        server ms-dashboard:8006;
    }

    server {
        listen 80;
        server_name localhost;

        location = /favicon.ico { return 204; }

        # ─── API Gateway routing ─────────────────────────────────────────────

        location /api/flights/ {
            proxy_pass         http://ms_flights/flights/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 30s;
        }

        location /api/bookings/ {
            proxy_pass         http://ms_bookings/bookings/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 30s;
        }

        location /api/routes/ {
            proxy_pass         http://ms_routes/routes/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 30s;
        }

        location /api/sync/ {
            proxy_pass         http://ms_sync/sync/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 30s;
        }

        location /api/tickets/ {
            proxy_pass         http://ms_tickets/tickets/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 60s;
        }

        location /api/dashboard/ {
            proxy_pass         http://ms_dashboard/dashboard/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 120s;
        }

        # ─── Health agregado ─────────────────────────────────────────────────
        location /health {
            return 200 '{"status":"ok","gateway":"nginx"}';
            add_header Content-Type application/json;
        }

        # ─── Frontend (cuando esté built) ────────────────────────────────────
        location / {
            root   /usr/share/nginx/html;
            index  index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
