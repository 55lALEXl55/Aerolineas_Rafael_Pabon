version: "3.9"

services:
  # ─── Bases de datos ─────────────────────────────────────────────────────────

  sqlserver1:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver1
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: ${DB1_PASSWORD}
      MSSQL_PID: Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver1_data:/var/opt/mssql
      - ./database/sqlserver/init_db1.sql:/docker-entrypoint-initdb.d/init_db1.sql
    networks:
      - aerolineas_net
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${DB1_PASSWORD}", "-Q", "SELECT 1", "-No"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  sqlserver2:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver2
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: ${DB2_PASSWORD}
      MSSQL_PID: Express
    ports:
      - "1434:1433"
    volumes:
      - sqlserver2_data:/var/opt/mssql
      - ./database/sqlserver/init_db2.sql:/docker-entrypoint-initdb.d/init_db2.sql
    networks:
      - aerolineas_net
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${DB2_PASSWORD}", "-Q", "SELECT 1", "-No"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  mongodb:
    image: mongo:7
    container_name: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB3_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${DB3_PASSWORD}
      MONGO_INITDB_DATABASE: ${DB3_NAME}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./database/mongodb/init_db3.js:/docker-entrypoint-initdb.d/init_db3.js
    networks:
      - aerolineas_net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ─── Microservicios ─────────────────────────────────────────────────────────

  ms-flights:
    build:
      context: ./backend
      dockerfile: services/ms-flights/Dockerfile
    container_name: ms-flights
    env_file: .env
    environment:
      NODE_ID: ${NODE_ID_AMERICA}
    ports:
      - "8001:8001"
    depends_on:
      sqlserver1:
        condition: service_healthy
      sqlserver2:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - aerolineas_net
    restart: unless-stopped

  ms-bookings:
    build:
      context: ./backend
      dockerfile: services/ms-bookings/Dockerfile
    container_name: ms-bookings
    env_file: .env
    ports:
      - "8002:8002"
    depends_on:
      sqlserver1:
        condition: service_healthy
      sqlserver2:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - aerolineas_net
    restart: unless-stopped

  ms-routes:
    build:
      context: ./backend
      dockerfile: services/ms-routes/Dockerfile
    container_name: ms-routes
    env_file: .env
    ports:
      - "8003:8003"
    depends_on:
      sqlserver1:
        condition: service_healthy
      sqlserver2:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - aerolineas_net
    restart: unless-stopped

  ms-sync:
    build:
      context: ./backend
      dockerfile: services/ms-sync/Dockerfile
    container_name: ms-sync
    env_file: .env
    ports:
      - "8004:8004"
    depends_on:
      sqlserver1:
        condition: service_healthy
      sqlserver2:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - aerolineas_net
    restart: unless-stopped

  ms-tickets:
    build:
      context: ./backend
      dockerfile: services/ms-tickets/Dockerfile
    container_name: ms-tickets
    env_file: .env
    ports:
      - "8005:8005"
    depends_on:
      sqlserver1:
        condition: service_healthy
      sqlserver2:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - aerolineas_net
    restart: unless-stopped

  ms-dashboard:
    build:
      context: ./backend
      dockerfile: services/ms-dashboard/Dockerfile
    container_name: ms-dashboard
    env_file: .env
    environment:
      MS_SYNC_URL: "http://ms-sync:8004"
    ports:
      - "8006:8006"
    depends_on:
      sqlserver1:
        condition: service_healthy
      sqlserver2:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - aerolineas_net
    restart: unless-stopped

  # ─── Nginx (sirve frontend React compilado + API gateway) ──────────────────

  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      # nginx.conf montado para poder cambiar routing sin rebuild del frontend
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ms-flights
      - ms-bookings
      - ms-routes
      - ms-sync
      - ms-tickets
      - ms-dashboard
    networks:
      - aerolineas_net
    restart: unless-stopped

# ─── Volúmenes persistentes ─────────────────────────────────────────────────

volumes:
  sqlserver1_data:
    driver: local
  sqlserver2_data:
    driver: local
  mongodb_data:
    driver: local

# ─── Red ────────────────────────────────────────────────────────────────────

networks:
  aerolineas_net:
    driver: bridge
